name: release

# Tag a commit as vX.Y.Z (or run manually) and this publishes the three
# artifacts plus checksums on a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test "test/*.test.js"

      - name: Build npm package
        run: |
          # npm pack refuses a destination directory that does not exist yet.
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Build source archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip -o "dist/dsh-collab-${version}-source.zip" HEAD
          git archive --format=tar.gz --prefix="dsh-collab-${version}/" -o "dist/dsh-collab-${version}-source.tar.gz" HEAD

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tgz *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        run: |
          # Curated notes win; fall back to a minimal body so a release never fails.
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" dist/release-body.md
          else
            echo "dsh-collab ${GITHUB_REF_NAME}" > dist/release-body.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release-body.md
          # Explicit patterns: release-body.md must not be uploaded as an asset.
          files: |
            dist/*.tgz
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
